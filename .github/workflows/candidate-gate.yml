name: Candidate Gate

# Forno del progetto: il Broker di Poonto adotta solo una SHA con questo
# workflow verde (executeGithubWorkerAdopt.mjs, assertCandidateGatePassed).
# Esegue il comando di qualita' dichiarato in .poonto/project.json.
on:
  push:
    branches:
      - 'poonto/rc/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Qualita' dichiarata nel contratto
        run: |
          node --input-type=module -e "import { readFileSync } from 'node:fs'; const html = readFileSync('index.html', 'utf8'); if (!html.includes('Ciao da Poonto')) { console.error('index.html non contiene la scritta'); process.exit(1) }"
          node --input-type=module -e "import { readFileSync } from 'node:fs'; const c = JSON.parse(readFileSync('.poonto/project.json', 'utf8')); if (c.projectKey !== 'ciao-da-poonto' || c.repository !== 'Poonto/ciao-da-poonto') { console.error('contratto incoerente'); process.exit(1) }"
